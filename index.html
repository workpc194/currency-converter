<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="https://m.media-amazon.com/images/I/510WmeXkLXL.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <nav>
        <h1>Currency Converter</h1>
    </nav>
    <div class="container">
        <div class="main-box">
            <div class="select">
                <div class="country from">
                    <p>From</p>
                    <img src="https://flagsapi.com/US/flat/64.png" width="40px">
                    <select id="dropdown" name="from"></select>
                </div>
                <i class="fa-solid fa-right-left"></i>
                <div class="country to">
                    <p>To</p>
                    <img src="https://flagsapi.com/PK/flat/64.png" width="40px">
                    <select id="dropdown" name="to"></select>
                </div>
            </div>
            <p class="text">Enter Amount You Want To Exchange</p>
            <form>
                <input type="number" value="1" id="amount">
                <button>Convert</button>
            </form>
            <h3>1 USD = 277 PKR</h3>
        </div>
    </div>
    <script src="codes.js"></script>
    <script src="script.js"></script>
</body>

</html>
